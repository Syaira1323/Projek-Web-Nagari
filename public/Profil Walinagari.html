<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Walinagari</title>
    <link rel="icon" href="image/logo agam.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="footer-styles.css" rel="stylesheet" />

    <style>
      body {
        background: url("image/forest2.jpg") no-repeat center center fixed;
        background-size: cover;
        font-family: Arial, sans-serif;
        padding-top: 90px; /* Agar konten tidak tertimpa navbar */
        min-height: 100vh;
      }

      .hero-profil {
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        border-radius: 20px;
        padding: 60px;
        margin-bottom: 100px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }

      .hero-profil img {
        max-width: 100%;
        border-radius: 10px;
      }

      .hero-profil h1 {
        font-size: 3rem;
        font-weight: bold;
      }

      .hero-profil .lead {
        font-size: 1.1rem;
        color: #ccc;
      }

      .signature {
        margin-top: 20px;
        font-family: cursive;
        font-size: 1.5rem;
      }

      /* === NAVBAR === */
      .navbar {
        transition: background-color 0.3s ease;
      }

      .navbar.transparent {
        background-color: transparent !important;
      }

      .navbar.scrolled {
        background-color: seagreen !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .dropdown:hover > .dropdown-menu {
        display: block;
      }

      .dropdown-submenu {
        position: relative;
      }

      .dropdown-submenu .dropdown-menu {
        top: 0;
        left: 100%;
        margin-left: 0;
        display: none;
        position: absolute;
      }

      .dropdown-submenu:hover .dropdown-menu {
        display: block;
      }

      .social-icons a {
        margin-left: 10px;
      }

      /* removed legacy breadcrumb-home styles (using breadcrumb.js) */

       @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in-up {
        animation: fadeInUp 1s ease-in-out;
      }
    </style>
  </head>

  <body>
    <!-- Navbar placeholder (template) -->
    <div id="navbar"></div>

    <!-- === PROFIL WALINAGARI === -->
    <div class="container hero-profil fade-in-up">
      <div class="row align-items-center">
        <div class="col-md-5 mb-3">
          <img src="image/patung yunani.png" alt="Foto Profil" />
        </div>
        <div class="col-md-7">
          <h1>Lorem.</h1>
          <p class="text-warning mb-2">Lorem, ipsum dolor.</p>
          <p class="lead">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Magnam
            cumque voluptatum ab expedita impedit natus asperiores veniam
            repellat ad facere?
          </p>
          <div class="signature">¬ Lorem.</div>
          <div class="mt-3">
            <a href="#"><i class="bi bi-twitter"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer placeholder -->
    <div id="footer"></div>

    <!-- === SCRIPT === -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Load navbar template
      fetch('navbar.html')
        .then(response => response.text()) 
        .then(data => {
          document.getElementById('navbar').innerHTML = data;
          initNavbarScrollEffect();
        })
        .catch(error => {
          console.error('Error loading navbar:', error);
        });

      // Load footer template
      fetch('footer.html')
        .then(response => response.text()) 
        .then(data => {
          document.getElementById('footer').innerHTML = data;
        })
        .catch(error => {
          console.error('Error loading footer:', error);
        });

      // Function untuk inisialisasi navbar scroll effect
      function initNavbarScrollEffect() {
        const navbar = document.querySelector('.navbar');
        if (!navbar) return;
        navbar.classList.add('transparent');
        window.addEventListener('scroll', function () {
          if (window.scrollY > 100) {
            navbar.classList.remove('transparent');
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
            navbar.classList.add('transparent');
          }
        });
      }
    </script>
    <script src="breadcrumb.js"></script>
  </body>
</html>
