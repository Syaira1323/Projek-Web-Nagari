<!DOCTYPE html>
<html lang="id">
  <head>
    <!--META & LINK -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survei Kepuasan</title>
    <!--Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"/>
    <link href="footer-styles.css" rel="stylesheet"/>

    <style>
      /* Prevent horizontal scroll */
      html, body { overflow-x: hidden; max-width: 100%; position: relative; }
      * { box-sizing: border-box; }
      .container, .container-fluid { max-width: 100%; padding-left: 15px; padding-right: 15px; }
      .row { margin-left: 0; margin-right: 0; }

      /* Navbar */
      .navbar { transition: background-color 0.3s ease; }
      .navbar.transparent { background-color: transparent !important; }
      .navbar.scrolled { background-color: seagreen !important; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

      /* Hero */
      .hero { background: white; color: #fff; height: 45vh; position: relative; }
      .overlay { height: 100%; width: 100%; display: flex; flex-direction: column; background-color: seagreen; position: absolute; top: 0; left: 0; }
      .hero-content { text-align: center; margin: auto; font-family: Tahoma; }

      /* Card subtle animation */
      .fade-in { opacity: 0; transform: translateY(15px); transition: all .6s ease; }
      .fade-in.visible { opacity: 1; transform: translateY(0); }
      /* === FOOTER STYLING (force same as index) === */
      .elegant-footer { background: linear-gradient(135deg, #2c5530 0%, #1e3a20 50%, #0f1d10 100%); color: white; position: relative; overflow: hidden; padding: 60px 0 20px; margin-top: 50px; }
      .footer-background { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.1; z-index: 1; }
      .footer-shapes { position: relative; width: 100%; height: 100%; }
      .footer-shape { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.05); }
      .footer-shape-1 { width: 200px; height: 200px; top: -50px; right: -50px; animation: float 6s ease-in-out infinite; }
      .footer-shape-2 { width: 150px; height: 150px; bottom: -30px; left: -30px; animation: float 8s ease-in-out infinite reverse; }
      .footer-shape-3 { width: 100px; height: 100px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float 10s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg) translateX(0px); } 25% { transform: translateY(-20px) rotate(5deg) translateX(-5px); } 50% { transform: translateY(-10px) rotate(-5deg) translateX(5px); } 75% { transform: translateY(-15px) rotate(3deg) translateX(-3px); } }
      .footer-section { position: relative; z-index: 2; height: 100%; }
      .footer-title { color: #4ade80; font-weight: 700; margin-bottom: 25px; font-size: 1.25rem; display: flex; align-items: center; }
      .footer-title i { color: #22c55e; margin-right: 10px; }
      .footer-content { line-height: 1.8; }
      .contact-item { display: flex; align-items: flex-start; margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; transition: all 0.3s ease; }
      .contact-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
      .contact-item i { color: #22c55e; font-size: 1.2rem; margin-right: 15px; margin-top: 3px; min-width: 20px; }
      .contact-item strong { color: #4ade80; display: block; margin-bottom: 5px; }
      .contact-item p { margin: 0; color: #e5e7eb; font-size: 0.95rem; }
      .schedule-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; transition: all 0.3s ease; }
      .schedule-item:hover { background: rgba(255, 255, 255, 0.1); }
      .schedule-item .day { font-weight: 600; color: #4ade80; }
      .schedule-item .time { color: #e5e7eb; font-size: 0.9rem; }
      .emergency-contact { margin-top: 20px; padding: 15px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; display: flex; align-items: center; }
      .emergency-contact i { color: #ef4444; margin-right: 10px; font-size: 1.1rem; }
      .emergency-contact span { color: #fecaca; font-weight: 600; }
      .map-container { position: relative; }
      .map-placeholder { border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); margin-bottom: 15px; }
      .map-placeholder iframe { width: 100%; height: 200px; border: none; filter: grayscale(20%) contrast(1.1); }
      .map-actions { text-align: center; }
      .map-actions .btn { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; transition: all 0.3s ease; }
      .map-actions .btn:hover { background: #22c55e; color: white; transform: translateY(-2px); }
      .footer-bottom { margin-top: 50px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.1); position: relative; z-index: 2; }
      .footer-logo { display: flex; align-items: center; }
      .footer-logo img { border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
      .footer-logo h6 { color: #4ade80; font-weight: 700; }
      .footer-logo small { color: #9ca3af; }
      .social-links { display: flex; justify-content: flex-end; gap: 15px; margin-bottom: 15px; }
      .social-link { display: inline-flex; align-items: center; justify-content: center; width: 45px; height: 45px; background: rgba(255, 255, 255, 0.1); color: #4ade80; border-radius: 50%; text-decoration: none; transition: all 0.3s ease; font-size: 1.2rem; }
      .social-link:hover { background: #22c55e; color: white; transform: translateY(-3px) scale(1.1); box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4); }
      .copyright { color: #9ca3af; font-size: 0.9rem; margin: 0; }
      @media (max-width: 768px) { .elegant-footer { padding: 40px 0 20px; } .footer-title { font-size: 1.1rem; margin-bottom: 20px; } .contact-item { padding: 12px; margin-bottom: 15px; } .schedule-item { padding: 10px 12px; } .social-links { justify-content: center; margin-bottom: 20px; } .footer-bottom .col-md-6 { text-align: center !important; margin-bottom: 20px; } .footer-logo { justify-content: center; } }
    </style>
  </head>
  <body>
    <!-- Navbar placeholder (loaded from navbar.html) -->
    <div id="navbar"></div>

    <!-- HERO -->
    <section class="hero d-flex align-items-center">
      <div class="overlay">
        <div class="hero-content text-white">
          <h1 class="fw-bold">Survei Kepuasan Masyarakat</h1>
          <p class="mb-0">Bantu kami meningkatkan layanan Nagari Koto Malintang</p>
        </div>
      </div>
    </section>

    <!-- SURVEY FORM -->
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-sm fade-in" id="surveyCard">
              <div class="card-header bg-success text-white">
                <i class="bi bi-bar-chart-fill me-2"></i> Formulir Survei Sederhana
              </div>
              <div class="card-body">
                <div id="alertPlaceholder"></div>
                <form id="surveyForm" novalidate>
                  <!-- Nama -->
                  <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama Anda" required>
                    <div class="invalid-feedback">Nama wajib diisi.</div>
                  </div>

                  <!-- Layanan digunakan -->
                  <div class="mb-3">
                    <label for="layanan" class="form-label">Layanan yang digunakan</label>
                    <select id="layanan" name="layanan" class="form-select" required>
                      <option value="" selected disabled>Pilih layanan</option>
                      <option>Administrasi Kependudukan</option>
                      <option>Informasi Publik</option>
                      <option>UMKM/Keuangan</option>
                      <option>Pengaduan</option>
                      <option>Lainnya</option>
                    </select>
                    <div class="invalid-feedback">Silakan pilih salah satu layanan.</div>
                  </div>

                  <!-- Kepuasan -->
                  <div class="mb-3">
                    <label class="form-label">Seberapa puas Anda terhadap pelayanan?</label>
                    <div class="d-flex gap-2 flex-wrap" role="group" aria-label="Rating kepuasan">
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="kepuasan" id="rate1" value="1" required>
                        <label class="form-check-label" for="rate1">1</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="kepuasan" id="rate2" value="2">
                        <label class="form-check-label" for="rate2">2</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="kepuasan" id="rate3" value="3">
                        <label class="form-check-label" for="rate3">3</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="kepuasan" id="rate4" value="4">
                        <label class="form-check-label" for="rate4">4</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="kepuasan" id="rate5" value="5">
                        <label class="form-check-label" for="rate5">5 (Sangat Puas)</label>
                      </div>
                      <div class="invalid-feedback d-block" id="ratingInvalid" style="display:none;">Silakan pilih nilai kepuasan.</div>
                    </div>
                  </div>

                  <!-- Saran -->
                  <div class="mb-3">
                    <label for="saran" class="form-label">Saran dan masukan</label>
                    <textarea id="saran" name="saran" class="form-control" rows="4" placeholder="Tuliskan saran Anda (opsional)"></textarea>
                  </div>

                  <div class="d-grid d-sm-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i>Kirim</button>
                    <button type="reset" class="btn btn-outline-secondary">Reset</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer placeholder -->
    <div id="footer"></div>

    <script>
      // Load navbar template
      fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar').innerHTML = data;
          initNavbarScrollEffect();
        })
        .catch(err => console.error('Error loading navbar:', err));

      // Load footer template
      fetch('footer.html')
        .then(response => response.text())
        .then(data => { document.getElementById('footer').innerHTML = data; })
        .catch(err => console.error('Error loading footer:', err));

      // Navbar scroll effect
      function initNavbarScrollEffect() {
        const navbar = document.querySelector('.navbar');
        if (!navbar) return;
        navbar.classList.add('transparent');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 100) {
            navbar.classList.remove('transparent');
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
            navbar.classList.add('transparent');
          }
        });
      }

      // Simple reveal animation
      window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('surveyCard').classList.add('visible'), 300);
      });

      // Form handling (client-side only)
      const form = document.getElementById('surveyForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Basic validation
        const nama = document.getElementById('nama');
        const layanan = document.getElementById('layanan');
        const ratingChecked = document.querySelector('input[name="kepuasan"]:checked');
        const ratingInvalid = document.getElementById('ratingInvalid');

        nama.classList.toggle('is-invalid', !nama.value.trim());
        layanan.classList.toggle('is-invalid', !layanan.value);
        ratingInvalid.style.display = ratingChecked ? 'none' : 'block';

        if (!nama.value.trim() || !layanan.value || !ratingChecked) return;

        // Collect data (for demo only)
        const payload = {
          nama: nama.value.trim(),
          layanan: layanan.value,
          kepuasan: ratingChecked.value,
          saran: (document.getElementById('saran').value || '').trim()
        };

        // Optional: store to localStorage (no backend here)
        try {
          const key = 'survey_koto_malintang_responses';
          const arr = JSON.parse(localStorage.getItem(key) || '[]');
          arr.push({ ...payload, ts: new Date().toISOString() });
          localStorage.setItem(key, JSON.stringify(arr));
        } catch (err) { /* ignore storage errors */ }

        // Show success alert
        const alert = document.createElement('div');
        alert.className = 'alert alert-success alert-dismissible fade show';
        alert.role = 'alert';
        alert.innerHTML = '<strong>Terima kasih!</strong> Tanggapan Anda sudah kami terima.' +
                          '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
        document.getElementById('alertPlaceholder').innerHTML = '';
        document.getElementById('alertPlaceholder').appendChild(alert);

        // Reset form
        form.reset();
      });
    </script>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="breadcrumb.js"></script>
  </body>
</html>
